<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EcoTag</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="logo">🌱 EcoTag</div>

  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="#">Funcionalidades</a>
    <a href="index.html#sobre">Sobre Nós</a>
    <a href="#">Contato</a>
  </nav>

  <div class="actions">
    <a href="cadastro.html" class="btn-cadastrar">Cadastrar</a>
  </div>
</header>

<main class="login-page">
  <section class="login-card">
    <h2>🌱 Bem-vindo de volta</h2>
    <p>Acesse sua conta EcoTag e acompanhe seu impacto ambiental.</p>

    <form id="loginForm">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Digite seu e-mail" required>

      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Digite sua senha" required>

      <button type="submit">Entrar</button>
    </form>

    <div class="login-links">
      <a href="#">Esqueci minha senha</a>
      <span>•</span>
      <a href="cadastro.html">Criar conta</a>
    </div>
  </section>
</main>

<footer class="footer">
  <p>© 2026 EcoTag • Todos os direitos reservados</p>
</footer>

<script src="login.js"></script>
</body>
</html>
